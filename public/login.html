<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>로그인</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
background: linear-gradient(135deg, #667eea, #764ba2);
min-height: 100vh;
}
</style>
</head>
<body class="d-flex align-items-center justify-content-center">
    <div class="card shadow-lg" style="width: 100%; max-width: 380px; border-radius: 1rem;">
        <div class="card-body p-4">
            <h3 class="text-center mb-4 fw-bold">로그인</h3>


        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">아이디</label>
                    <input type="text" class="form-control" id="username" placeholder="아이디를 입력하세요" required>
            </div>


            <div class="mb-3">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" class="form-control" id="password" placeholder="비밀번호를 입력하세요" required>
            </div>


            <button type="submit" class="btn btn-primary w-100">로그인</button>
        </form>


        <div id="message" class="text-center mt-3 small"></div>


            <hr class="my-4">


            <div class="text-center">
                <a href="#" class="text-decoration-none">회원가입</a> ·
                <a href="#" class="text-decoration-none">비밀번호 찾기</a>
            </div>
        </div>
    </div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


<script>
    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');


    form.addEventListener('submit', function (e) {
    e.preventDefault();


    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;


    if (username === 'admin' && password === '1234') {
        message.className = 'text-center mt-3 small text-success';
        message.textContent = '로그인 성공!';
    } else {
        message.className = 'text-center mt-3 small text-danger';
        message.textContent = '아이디 또는 비밀번호가 올바르지 않습니다.';
    }
});
</script>
</body>
</html>
